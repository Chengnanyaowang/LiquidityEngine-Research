name: Public reference CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install public package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Run deterministic replay demo
        run: python scripts/run_demo.py
      - name: Run bounded agent scenarios
        run: python scripts/run_agent_demo.py --scenario all
