[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidityengine-research"
version = "0.2.0"
description = "Public reference primitives for auditable crypto-derivatives research workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Zhang Qingyu"},
  {name = "Li Runpeng"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Chengnanyaowang/LiquidityEngine-Research"
Repository = "https://github.com/Chengnanyaowang/LiquidityEngine-Research"
Demo = "https://youtu.be/Jy_4ANm5ClY"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
